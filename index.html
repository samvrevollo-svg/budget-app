<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Server Budget Guide</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">
    <h1 class="title" id="greeting"></h1>


    <!-- MONTH SELECTOR -->
    <div class="month-bar">
      <button onclick="changeMonth(-1)">←</button>
      <span id="monthLabel"></span>
      <button onclick="changeMonth(1)">→</button>
    </div>

    <div class="main">

      <!-- LEFT: INCOME INPUT -->
      <div class="panel left">
        <h2>Add Income</h2>
        <input type="number" id="incomeInput" placeholder="Enter income">
        <button onclick="addIncome()">Add</button>
      </div>

      <!-- CENTER: CALENDAR -->
      <div class="center">
        <div id="calendar" class="calendar"></div>

        <div class="payday">
          Days until payday: <span id="days">0</span>
        </div>
      </div>

      <!-- RIGHT: OVERVIEW -->
      <div class="panel right">
        <h2>Overview</h2>

        <p>Total Income: $<span id="income">0</span></p>

        <div id="categories"></div>

        <button onclick="openPopup()">+ Add Category</button>
      </div>

    </div>

  </div>

  <!-- CATEGORY POPUP -->
  <div id="popup" class="popup hidden">
    <div class="popup-content">
      <h2>Add Category</h2>

      <input type="text" id="catName" placeholder="Category name">

      <select id="catType">
        <option value="percent">Percentage (%)</option>
        <option value="fixed">Fixed Amount ($)</option>
      </select>

      <input type="number" id="catValue" placeholder="Enter value">

      <div class="popup-buttons">
        <button onclick="addCategory()">Save</button>
        <button onclick="closePopup()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- DAY POPUP -->
  <div id="dayPopup" class="popup hidden">
    <div class="popup-content">
      <h3>Edit Income</h3>

      <input type="number" id="dayAmount" placeholder="Enter income">

      <div class="popup-buttons">
        <button onclick="saveDayIncome()">Save</button>
        <button onclick="deleteDayIncome()">Delete</button>
        <button onclick="closeDayPopup()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- QUIZ ONBOARDING -->
<div id="quiz" class="popup hidden">
  <div class="quiz-card">

    <!-- STEP 1 -->
    <div class="quiz-step" id="step1">
      <h2>✨ Welcome!</h2>
      <p class="quiz-sub">What’s your name?</p>

      <input type="text" id="qName" placeholder="Your name">

      <button class="quiz-btn" onclick="nextStep(2)">Next</button>
    </div>

    <!-- STEP 2 -->
    <div class="quiz-step hidden" id="step2">
      <h2>💸 What do you spend money on?</h2>
      <p class="quiz-sub">Add your budgeting needs</p>

      <input type="text" id="qNeedInput" placeholder="e.g. Rent, Car, Savings">
      <button onclick="addNeed()">+ Add</button>

      <div id="needsList"></div>

      <button class="quiz-btn" onclick="nextStep(3)">Next</button>
    </div>

    <!-- STEP 3 -->
    <div class="quiz-step hidden" id="step3">
      <h2>📅 When is your payday?</h2>
      <p class="quiz-sub">Pick a day of the month</p>

      <input type="number" id="qPayday" placeholder="1-31">

      <button class="quiz-btn" onclick="finishQuiz()">Finish</button>
    </div>

  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="script.js"></script>

</body>
</html>
